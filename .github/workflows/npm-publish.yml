name: Publish to npmjs.org

permissions:
  id-token: write
  contents: read

on:
    push:
        branches: [ main ]
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
            - run: cd lib && npm install && npm run build
            - run: npm publish --access public
